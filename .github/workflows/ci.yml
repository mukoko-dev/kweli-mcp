name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# Read-only token: this job only checks out, installs and tests.
permissions:
  contents: read

jobs:
  test-and-build:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm test

      - run: pnpm build
