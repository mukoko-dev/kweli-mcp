name: CI

on:
  push:
    branches: [main, staging]
  # Merge queue: required checks must also run on the queue's merge group, or
  # queued PRs wait 60 minutes and drop out.
  merge_group:
    types: [checks_requested]
  pull_request:

# Read-only token: this job only checks out, installs and tests.
permissions:
  contents: read

jobs:
  test-and-build:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm test

      - run: pnpm build
