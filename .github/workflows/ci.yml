name: CI

on:
  push:
    branches: [main]
  # Merge queue: required checks must also run on the queue's merge group, or
  # queued PRs wait 60 minutes and drop out.
  merge_group:
    types: [checks_requested]
  pull_request:

# Read-only token: this job only checks out, installs and tests.
permissions:
  contents: read

jobs:
  test-and-build:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.15.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm type-check

      - run: pnpm test

      - run: pnpm build
