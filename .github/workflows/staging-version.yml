# Versioning policy (nyuchi/.github#80): every merge into `staging` is
# released as the next PATCH, tagged on the merged commit.
name: Staging version

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the bump (major is only ever manual).
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/staging'
    uses: nyuchi/.github/.github/workflows/reusable-staging-release.yml@755c93763e6e0245fc2729c6a361240017ab6ccc # main, 2026-10-04
    with:
      bump: ${{ inputs.bump || '' }}
    permissions:
      contents: write
