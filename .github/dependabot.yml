# Pull requests target the default branch.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new release waits a week before Dependabot proposes it, so a hijacked
    # or broken release has time to be caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A new release waits a week before Dependabot proposes it, so a hijacked
    # or broken release has time to be caught and pulled first.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Until Astro and typescript-eslint support TS 7; remove then.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
